services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-fika_app}
      DB_PASS: ${DB_PASS:-fika_dev_password}
      DB_NAME: ${DB_NAME:-fika}
    volumes:
      - ./Fika:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-fika}
      MYSQL_USER: ${DB_USER:-fika_app}
      MYSQL_PASSWORD: ${DB_PASS:-fika_dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-fika_root_dev_password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
